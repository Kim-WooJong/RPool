# Builds RPool for each OS and attaches the archives to a GitHub release.
#
# - Pushing a tag `vX.Y.Z` builds that tag and publishes its release.
#   (GitHub sends no tag events when more than three tags are pushed at once,
#   so a bulk `git push --tags` does not start a build per old tag.)
# - "Run workflow" (Actions tab) builds an existing tag with this workflow,
#   e.g. a tag created before this file existed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v2.12.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  qualification:
    name: require native QA for tagged commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.q.outputs.sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/github-script@v7
        id: q
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = process.env.TAG;
            if (tag.trim() !== tag || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(tag)) {
              throw new Error('Input must name an existing version tag, not a branch or SHA.');
            }
            let object = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data.object;
            for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
              object = (await github.rest.git.getTag({owner, repo, tag_sha: object.sha})).data.object;
            }
            if (object.type !== 'commit') throw new Error('Tag must resolve to a commit.');
            const sha = object.sha;
            const response = await github.rest.actions.listWorkflowRunsForRepo({owner, repo, event: 'push', per_page: 100});
            const runs = response.data.workflow_runs.filter(r =>
              r.head_sha === sha &&
              r.path.split('@')[0] === '.github/workflows/verify.yml' &&
              r.head_branch && r.head_branch.startsWith('release/') &&
              r.head_repository && r.head_repository.full_name === owner + '/' + repo
            ).sort((a, b) => b.id - a.id);
            if (!runs.length || runs[0].status !== 'completed' || runs[0].conclusion !== 'success') {
              core.setFailed('Exact tagged commit must pass the release-branch native verification workflow first.');
              return;
            }
            core.setOutput('sha', sha);
            core.info('Qualified ' + sha + ' by ' + runs[0].html_url);
  build:
    needs: qualification
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu keeps the glibc requirement low for other distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: macos-15, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-15, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualification.outputs.sha }}
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      # The default `winfsp` feature links WinFsp's SDK import library
      # (delay-loaded: PCs without WinFsp still start and use WebDAV).
      - name: WinFsp SDK
        if: runner.os == 'Windows'
        run: choco install winfsp -y --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --bin rpool --bin rpool-gui

      - name: Package
        shell: bash
        run: |
          dir="rpool-${TAG}-${{ matrix.name }}"
          mkdir "$dir"
          bin="target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$bin/rpool.exe" "$bin/rpool-gui.exe" "$dir/"
          else
            cp "$bin/rpool" "$bin/rpool-gui" "$dir/"
          fi
          cp README.md LICENSE "$dir/" 2>/dev/null || cp README.md "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$dir.zip" "$dir" >/dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: [qualification, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualification.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        run: |
          version="${TAG#v}"
          awk -v version="$version" '
            /^## / {
              if (found) exit
              if ($2 == version) { found = 1; print; next }
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Recheck immutable tag identity before publication
        uses: actions/github-script@v7
        env:
          QUALIFIED_SHA: ${{ needs.qualification.outputs.sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = process.env.TAG;
            if (tag.trim() !== tag || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(tag)) {
              throw new Error('Input must name an existing version tag, not a branch or SHA.');
            }
            let object = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data.object;
            for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
              object = (await github.rest.git.getTag({owner, repo, tag_sha: object.sha})).data.object;
            }
            if (object.type !== 'commit') throw new Error('Tag must resolve to a commit.');
            const sha = object.sha;
            if (sha !== process.env.QUALIFIED_SHA) throw new Error('Tag changed after qualification; publication refused.');

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ needs.qualification.outputs.sha }}
          name: RPool ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ contains(env.TAG, '-') && 'false' || 'true' }}
          body_path: RELEASE_NOTES.md
          files: dist/*
