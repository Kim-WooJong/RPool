name: Storage cross-platform
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev libgtk-3-dev
      - name: Build application
        run: cargo build --locked --bin rpool
      - name: Run offline-account unit and fixture tests
        run: cargo test --locked --bin rpool
      - name: Build optional synthetic OpenDAL configuration
        run: cargo build --locked --features opendal-prototype --bin rpool
      - name: Test optional synthetic OpenDAL configuration
        run: cargo test --locked --features opendal-prototype --bin rpool
  winfsp-frontend:
    name: windows-latest (WinFsp frontend)
    runs-on: windows-latest
    timeout-minutes: 30
    # Not yet qualified on a real Windows host; must not block the main matrix.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install WinFsp (runtime and developer import library)
        run: choco install winfsp -y
      - name: Build with the native WinFsp frontend
        run: cargo build --locked --features winfsp --bin rpool
      - name: Run tests with the WinFsp frontend compiled in
        run: cargo test --locked --features winfsp --bin rpool
