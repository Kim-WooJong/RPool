name: Storage cross-platform
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev libgtk-3-dev
      - name: Build application
        run: cargo build --locked --bin rpool
      - name: Run offline-account unit and fixture tests
        run: cargo test --locked --bin rpool
      - name: Build optional synthetic OpenDAL configuration
        run: cargo build --locked --features opendal-prototype --bin rpool
      - name: Test optional synthetic OpenDAL configuration
        run: cargo test --locked --features opendal-prototype --bin rpool
