[package]
name = "rpool"
version = "0.7.0"
edition = "2021"
description = "Parallel sharded storage with Reed-Solomon erasure coding over rclone remotes"
license = "MIT"
autolib = false
autobins = false

[workspace]
resolver = "2"

[[bin]]
name = "rpool"
path = "src/main.rs"

[features]
default = []
# Synthetic Memory adapter only; does not enable production native writes.
opendal-prototype = ["dep:opendal"]

[dependencies]
opendal = { version = "=0.59.3", default-features = false, optional = true }
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
anyhow = "1"
# Explicit OpenGL renderer avoids the wgpu staging-buffer failure reported on Windows.
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "glow", "x11"] }
rfd = "0.17.2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
reed-solomon-erasure = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Already present in Cargo.lock; promoted for secret generation/atomic ciphertext writes.
getrandom = "0.3.4"
tempfile = "3.27.0"
dav-server = { version = "0.8", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Isolated synthetic LocalBackend: descriptor-relative, no-follow Unix filesystem I/O.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
