[package]
name = "rpool"
version = "2.8.0"
edition = "2021"
description = "Parallel sharded storage with Reed-Solomon erasure coding over rclone remotes"
license = "MIT"
autolib = false
autobins = false

[workspace]
resolver = "2"

[[bin]]
name = "rpool"
path = "src/main.rs"

# Starts the GUI without a console window (Windows GUI subsystem launcher).
[[bin]]
name = "rpool-gui"
path = "src/launcher/main.rs"

[features]
# `winfsp` only pulls in Windows-only dependencies, so it is a no-op elsewhere.
# On a Windows build machine without WinFsp (SDK import library), build with
# `--no-default-features`: that binary mounts through WebDAV only.
default = ["winfsp"]
# Native WinFsp frontend (mount milestone M4), default on Windows. Building it
# needs WinFsp with its SDK import library (MSVC toolchain) on the Windows build
# machine; the DLL is delay-loaded, so PCs without WinFsp fall back to WebDAV.
winfsp = ["dep:winfsp_wrs", "dep:winfsp_wrs_build"]

[dependencies]
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
anyhow = "1"
# Explicit OpenGL renderer avoids the wgpu staging-buffer failure reported on Windows.
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "glow", "x11"] }
rfd = "0.17.2"
blake3 = "1"
# Provider-reported hashes of uploaded ciphertext (upload verification without readback).
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
rayon = "1"
reed-solomon-erasure = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Already present in Cargo.lock; promoted for secret generation/atomic ciphertext writes.
getrandom = "0.3.4"
tempfile = "3.27.0"
dav-server = { version = "0.8", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
futures-util = "0.3"
aes = "0.8.4"
ctr = "0.9.2"
zeroize = "1.9"
scrypt = { version = "0.11.0", default-features = false }
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["salsa20", "alloc"] }
data-encoding = "2.11"

# Native FUSE frontend on macOS through macFUSE. `macos-no-mount` keeps fuser
# from linking libfuse at build time (no pkg-config or macFUSE needed to
# build); RPool loads macFUSE's libfuse at runtime to mount and hands the
# device descriptor to fuser. `macfuse-4-compat` is the kernel ABI fuser
# selects itself when it links macFUSE (4.x and later).
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18", default-features = false, features = ["macos-no-mount", "macfuse-4-compat"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winfsp_wrs = { version = "0.4.1", optional = true }

# Not target-gated: target tables on build-dependencies match the host, and
# build.rs checks the target itself. Tiny, dependency-free crate.
[build-dependencies]
winfsp_wrs_build = { version = "0.4.1", optional = true }

# Native FUSE frontend (mount milestone M5); pure-Rust mount, no libfuse.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"
